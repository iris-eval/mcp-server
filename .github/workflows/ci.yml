name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Top-level least-privilege default. Individual jobs override when they
# need more (e.g., security-exposure declares contents:read; no job in
# this workflow needs write). Closes Scorecard Token-Permissions.
permissions:
  contents: read

jobs:
  # Every workflow file in .github/workflows, linted on every pull request:
  # YAML syntax, expressions, job and step references, action inputs, and
  # each `run:` script through shellcheck. publish-python.yml once reached
  # main unparseable (a plain scalar holding `:all: -r` read as a mapping),
  # and nothing noticed, because the workflow runs on a tag, not a pull
  # request. The image is actionlint 1.7.12 (it bundles shellcheck), pinned
  # by its multi-arch index digest; bump the version and the digest together
  # (`docker buildx imagetools inspect rhysd/actionlint:<version>`).
  actionlint:
    name: Workflows lint (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: actionlint over every workflow
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: bash scripts/check-version.sh
      - run: bash scripts/check-product-claims.sh
      # The LLM-facing surface (website/public/llms*.txt) must be the render
      # of its template + .claims.json — see scripts/claims/render-llms.mjs.
      - run: npm run llms:check
      # NOTE: `npm audit --audit-level=high` used to run here. It was removed
      # 2026-08-06 because it could deadlock the repo against itself.
      #
      # A raw audit exit code fails on the WHOLE set of open advisories, so
      # with N>1 independent HIGHs outstanding, every PR went red — including
      # each Dependabot PR that fixed one of them, because the other N-1
      # remained. No single PR could turn it green, so nothing could merge,
      # so the advisories could never drain. That is exactly what happened:
      # 4 HIGHs (brace-expansion, fast-uri, ip-address, postcss) blocked all
      # 40 open PRs at once.
      #
      # THE INVARIANT (do not reintroduce a gate that violates it):
      #   A blocking gate must always be satisfiable by a change made INSIDE
      #   the pull request it is blocking. If clearing it requires some OTHER
      #   pull request to merge first, the gate can deadlock.
      #
      # Dependency-security enforcement lives in the `security-exposure` job,
      # which is strictly stronger AND deadlock-free: it runs on the same PR
      # trigger, covers >=moderate (a lower threshold than high), and demands
      # a documented threat-model decision per advisory. Both of its exits —
      # add a triage row, or bump the dep — are edits inside the PR itself.
      - run: npm run lint
      - run: npm run typecheck
      # npm ci (from the 2026-09-20 audit; closes the code-scan "pinned
      # dependencies" finding on this file). The dashboard lockfile carries
      # the Linux rolldown binding and the three @emnapi entries a Windows
      # `npm install` used to prune; if a future Windows install prunes them
      # again this step goes red here rather than drifting silently. Repair
      # recipe: regenerate the lockfile under Linux (Dependabot, WSL or
      # Docker), never `--package-lock-only` on Windows.
      - run: cd dashboard && npm ci --no-audit --no-fund && npm run typecheck && npm run lint && npm test
      # Storybook smoke (audit item #11): build catalog to catch broken
      # stories before they ship. No pixel regression yet — Chromatic/
      # lost-pixel vendor choice is a separate, open decision.
      - run: cd dashboard && npm run build-storybook

  typecheck-tests:
    # Every test file, type-checked: tests/ under tsconfig.tests.json, and the
    # Playwright specs (whose page callbacks run in the browser) under
    # tsconfig.e2e.json with the DOM library. The root tsconfig covers src/
    # only, so until this job a test could read a response field under a
    # name the server no longer sends, or build a fixture the types have
    # moved past, and find out at run time or never. The dashboard's tests
    # are checked by its own `npm run typecheck` in lint-and-typecheck.
    # Named so branch protection can require it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck:tests

  test:
    # Branch protection requires "test (22)" and "test (24)" by name; the
    # native cells carry those names, the built-in and macOS cells add theirs.
    # "test (20)" is gone with Node 20 and must be removed from the required
    # set, or it blocks every PR waiting for a check that can never report.
    name: ${{ matrix.os == 'macos-latest' && format('test ({0}, macOS)', matrix.node-version) || (matrix.driver == 'native' && format('test ({0})', matrix.node-version) || format('test ({0}, {1})', matrix.node-version, matrix.driver)) }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One red cell must not cancel its siblings. Dependabot #308 sat open for
      # six weeks on the reading that better-sqlite3 13 crashed on Node 20, 22
      # AND 24; the 22 and 24 cells had never run — fail-fast cancelled them
      # the moment Node 20 went red, and `cancelled` was read as `failed`.
      fail-fast: false
      matrix:
        node-version: [22, 24]
        driver: [native]
        os: [ubuntu-latest]
        # The storage driver seam: the whole suite once more on
        # Node's built-in SQLite, on both supported lines.
        include:
          - node-version: 22
            driver: node
            os: ubuntu-latest
          - node-version: 24
            driver: node
            os: ubuntu-latest
          # The first macOS cell this repository has ever had: every other job
          # runs on ubuntu, so the native SQLite addon has never been exercised
          # on Apple Silicon at all. That is the platform where
          # WiseLibs/better-sqlite3#1514 reports a crash on Node 20 and 22 —
          # a crash a Linux-only matrix cannot see, and would ship.
          - node-version: 22
            driver: native
            os: macos-latest
    env:
      IRIS_SQLITE_DRIVER: ${{ matrix.driver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Coverage gate: enforces the ratchet floors in vitest.config.ts
      # (a plain `npm test` run would leave the thresholds unenforced).
      - run: npm run test:coverage

  # Full-text trace search (#7) uses FTS5 with secure-delete (SQLite 3.42+)
  # from whichever driver holds the file: better-sqlite3's bundled SQLite, or
  # Node's built-in node:sqlite. The test matrix above covers Linux on both
  # and macOS on native only, and no job runs the store on Windows. This one
  # runs the search suites on every OS with both drivers, the built-in at 24
  # and at the oldest Node the package accepts, 22.13.0, whose SQLite has no
  # FTS5 (the built-in gains it at 22.16.0). Each cell asserts that promise
  # for its own driver and Node, and the 22.13.0 cells run the scan fallback
  # end to end on a real SQLite without FTS5.
  search-index:
    name: search index (${{ matrix.os }}, ${{ matrix.driver }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        driver: [native, node]
        node-version: ['22.13.0', 24]
        exclude:
          # The native driver bundles its own SQLite, the same on every Node line; one Node per OS is enough.
          - driver: native
            node-version: '22.13.0'
    env:
      IRIS_SQLITE_DRIVER: ${{ matrix.driver }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx vitest run tests/unit/storage/migration-015.test.ts tests/unit/storage/trace-search.test.ts tests/unit/storage/search-query.test.ts tests/unit/tools/get-traces-search.test.ts tests/unit/storage/stepped-maintenance.test.ts tests/unit/storage/checkpointer.test.ts tests/unit/storage/driver.test.ts tests/unit/storage/erasure.test.ts

  # The retention sweep, the merge it owes, the erasure of a retired search
  # index and the index build run in steps of about 50 ms with the event loop
  # free between them, so a stdio client is never kept waiting on the store.
  # This runs each on 10,000 agent-loop traces and fails when the event loop
  # is held longer than the limit in tests/stall/event-loop.test.ts, or when
  # iris.db-wal grows past its ceiling under writes that never pause or
  # while the index is built. It
  # measures time, so it runs alone, outside the parallel suite, on both
  # drivers.
  stall-guard:
    name: stall guard (${{ matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [native, node]
    env:
      IRIS_SQLITE_DRIVER: ${{ matrix.driver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx vitest run --config tests/stall/vitest.config.ts

  # The test jobs install better-sqlite3's prebuilt binary. When that download
  # fails, `prebuild-install || node-gyp rebuild` compiles it here instead,
  # against this Node's headers, and a binary compiled against Node 24.19+
  # headers aborts the process the first time V8 frees one of its statements
  # ("Assertion failed: (env) != nullptr", nodejs/node#65446; every 24.x
  # release so far). A user whose download failed gets that binary too.
  # This job compiles it on purpose on Linux, macOS and Windows and requires: the binary
  # aborts under collection exactly when Iris predicts it; Iris never loads
  # it there (it holds the store with node:sqlite, and says why); and the
  # real server, started and stopped over stdio again and again, ends every
  # session cleanly. Node 22 is the control: its headers never changed, so
  # its binary is safe and Iris keeps the native driver. When a Node 24
  # release carries the fix, the collect test here fails with the version
  # to add to runtimeKeepsAddonHooks.
  native-from-source:
    name: native addon built from source (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
        exclude:
          # The node-gyp that ships with Node 22's npm 10 cannot identify the
          # runner's Visual Studio 18 ("unknown version"), so nothing compiles
          # there and npm drops the optional module (the install-without-
          # better-sqlite3 job covers that path). The Node 22 control runs on
          # Linux and macOS.
          - os: windows-latest
            node-version: 22
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install, compiling better-sqlite3 here instead of downloading it
        env:
          npm_config_build_from_source: 'true'
        # --foreground-scripts: the compiler's output is in the log, including when the optional build fails and npm drops the module.
        run: npm ci --foreground-scripts
      - name: The binary was compiled on this runner, against this Node's headers
        run: |
          # A prebuilt download holds only build/Release; node-gyp leaves its config beside it.
          test -d node_modules/better-sqlite3 || { echo "::error::better-sqlite3 did not compile here and npm dropped it (it is optional); the install log above says why"; exit 1; }
          test -f node_modules/better-sqlite3/build/config.gypi || { echo "::error::better-sqlite3 was not compiled here, so this job proves nothing"; exit 1; }
          node -e "
            const fs = require('fs');
            const marked = fs.readFileSync('node_modules/better-sqlite3/build/Release/better_sqlite3.node').includes('RemoveEnvironmentCleanupHook');
            console.log('Node ' + process.versions.node + ': binary carries the ObjectWrap cleanup-hook call: ' + marked);
            if (process.versions.node.startsWith('24.') && !marked) { console.error('::error::Node 24 headers should have compiled the call in; this job proves nothing'); process.exit(1); }
          "
      - run: npx vitest run tests/integration/native-addon-collect.test.ts tests/integration/native-teardown-stdio.test.ts tests/unit/storage/driver.test.ts
      - name: The self-test names the driver and why
        run: |
          IRIS_HOME="$RUNNER_TEMP/iris-home" IRIS_DB_PATH="$RUNNER_TEMP/iris-home/iris.db" node --import tsx src/index.ts --self-test | tee self-test.txt
          if [ "${{ matrix.node-version }}" = 24 ]; then
            grep -q "driver node: better-sqlite3 here was compiled against Node headers that abort" self-test.txt
          else
            grep -q "driver better-sqlite3" self-test.txt
          fi

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:integration

  # The regression watcher reads its alarm lines from a generated table
  # (src/eval/cusum-thresholds.generated.ts) instead of simulating them on
  # a server's first request. This regenerates every row from its seed and
  # fails when the committed table differs from the simulation.
  cusum-thresholds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run cusum:check

  # The search tokenizer (src/storage/search.ts) reads a table of what
  # SQLite's unicode61 tokenizer does with every code point
  # (src/storage/unicode61.generated.ts). This asks SQLite again and fails
  # when the committed table differs.
  search-tokenizer-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run unicode61:check

  # The website previously had NO CI gate at all — Vercel builds it without
  # linting, and 26 lint errors accumulated invisibly (found 2026-07-07).
  # This job makes website lint + typecheck a first-class check.
  website-lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: cd website && npm ci
      - run: cd website && npm run lint
      - run: cd website && npx tsc --noEmit
      # The production build, against this branch's .claims.json and docs/blog/.
      # A pull request that changes neither website/ nor docs/blog/ gets no
      # preview deployment (website/scripts/ignore-build.sh), so this is where
      # a .claims.json change that would break the site's build is caught.
      - run: cd website && npm run build

  # Upgrading from the previous release (#704): tests/upgrade installs the
  # released 0.19.0 from npm into a scratch home, has it install three MCP
  # clients and store traces, then upgrades that database with this commit:
  # the copy taken first, the clients it strands named, 0.19.0 refused,
  # `install --upgrade` moving the pins, the self-test before and after
  # (reading the file without changing it), and the downgrade drill from the
  # README. Every OS, because file names, locks and client paths differ.
  upgrade:
    name: Upgrade from the previous release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint-and-typecheck]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx vitest run --config tests/upgrade/vitest.config.ts

  # Real MCP clients against the config `iris-eval install` writes: the
  # evidence behind every `verified` row in clients.json that names
  # tests/real-clients/real-clients.test.ts. The pack job builds this commit
  # and packs it under a version no registry has (0.0.0-ci.<run id>), so the
  # entry the installer writes pins a version only the tarball can satisfy:
  # when a client reports Connected, the server it started is this commit's,
  # never a release. Each OS then installs the tarball into an empty project,
  # installs Claude Code and Gemini CLI at pinned versions, and runs the test.
  # `claude mcp list` / `claude mcp get` and `gemini mcp list` make no model
  # call and need no account. Bump a client's version here to re-verify it.
  real-clients-pack:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: cd dashboard && npm ci --no-audit --no-fund
      - name: A version no registry has
        run: npm version "0.0.0-ci.${GITHUB_RUN_ID}" --no-git-tag-version
      - run: npm run build
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: real-clients-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          retention-days: 3

  # better-sqlite3 is optional (#661): an install where it cannot build must
  # still succeed, and Iris must run on Node's built-in SQLite. The packed
  # tarball is installed into an empty project with the native build forced
  # to fail (no prebuilt download, a compiler that always fails), and the
  # job requires npm to finish without it, the self-test to start the
  # server, store a trace and read it back on node:sqlite, and ingest to
  # store and score one more.
  no-native-sqlite:
    name: Install without better-sqlite3 (node:sqlite)
    runs-on: ubuntu-latest
    needs: [real-clients-pack]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: real-clients-tarball
          path: ${{ runner.temp }}/pack
      - name: Install with the native build forced to fail
        env:
          # No prebuilt binary: prebuild-install skips the download and hands over to node-gyp.
          npm_config_build_from_source: 'true'
          # And node-gyp cannot compile: every compiler invocation fails.
          CC: /bin/false
          CXX: /bin/false
        run: |
          tarball="$(cd "$RUNNER_TEMP/pack" && ls -- *.tgz)"
          mkdir -p "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --foreground-scripts "$RUNNER_TEMP/pack/$tarball"
          if [ -d node_modules/better-sqlite3 ]; then
            echo "::error::better-sqlite3 is installed; the forced build failure did not take, so this job proves nothing"
            exit 1
          fi
      - name: The self-test starts the server, stores a trace and reads it back on node:sqlite
        run: |
          cd "$RUNNER_TEMP/project"
          ./node_modules/.bin/iris-eval --self-test | tee self-test.txt
          grep -q "driver node: better-sqlite3 is not installed" self-test.txt
          grep -q "PASS — this install works" self-test.txt
      - name: Ingest stores and scores a trace on node:sqlite
        run: |
          cd "$RUNNER_TEMP/project"
          export IRIS_HOME="$RUNNER_TEMP/iris-home"
          echo '{"agent_name":"ci","input":"What is 2 + 2?","output":"2 + 2 is 4."}' | ./node_modules/.bin/iris-eval ingest --evaluate 2> ingest.err | tee ingest.out
          grep -q '"trace_id"' ingest.out
          grep -q "is not installed" ingest.err

  real-clients:
    name: Real clients (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [real-clients-pack]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # The test runner only: the server under test is the tarball.
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: real-clients-tarball
          path: ${{ runner.temp }}/pack
      - name: Install the tarball into an empty project
        run: |
          tarball="$(cd "$RUNNER_TEMP/pack" && ls -- *.tgz)"
          mkdir -p "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP/pack/$tarball"
          ./node_modules/.bin/iris-eval --version
      # Exact versions, from a committed lockfile: .github/real-clients pins
      # each client and its whole tree by integrity hash, and `npm ci`
      # installs exactly that on every OS. A client release that changes
      # what it reads is found by bumping one there (Dependabot proposes
      # it), not by a red run.
      - name: Install the clients from their lockfile
        run: |
          cd .github/real-clients
          npm ci --no-audit --no-fund
          bin="$PWD/node_modules/.bin"
          # Windows runners: a native path, so cmd.exe (which the tests spawn through for .cmd shims) resolves it.
          if command -v cygpath > /dev/null; then bin="$(cygpath -w "$bin")"; fi
          echo "$bin" >> "$GITHUB_PATH"
          ./node_modules/.bin/claude --version
          ./node_modules/.bin/gemini --version
      - name: The clients connect to the server install wrote
        env:
          IRIS_REAL_CLIENTS: '1'
          IRIS_REAL_CLIENTS_PROJECT: ${{ runner.temp }}/project
        run: npx vitest run --config tests/real-clients/vitest.config.ts

  # The MCPB bundle (iris-eval.mcpb): what release.yml attaches to each
  # release for one-click install in Claude Desktop, and what Smithery lists
  # a local server from. The pack job builds this commit, packs it with
  # `npm pack`, and builds the bundle from that tarball the way the release
  # does (scripts/mcpb/pack.mjs) — twice, to show the build is deterministic
  # — then checks the bundle holds the tarball's files byte for byte.
  mcpb-pack:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: cd dashboard && npm ci --no-audit --no-fund
      - run: npm run build
      - name: Pack the package, then the bundle from it
        run: |
          mkdir -p "$RUNNER_TEMP/mcpb"
          npm pack --pack-destination "$RUNNER_TEMP/mcpb"
          tarball="$RUNNER_TEMP/mcpb/$(cd "$RUNNER_TEMP/mcpb" && ls -- *.tgz)"
          node scripts/mcpb/pack.mjs --tarball "$tarball" --out "$RUNNER_TEMP/mcpb/iris-eval.mcpb"
          node scripts/mcpb/pack.mjs --tarball "$tarball" --out "$RUNNER_TEMP/second.mcpb"
          cmp "$RUNNER_TEMP/mcpb/iris-eval.mcpb" "$RUNNER_TEMP/second.mcpb" || { echo "::error::two builds of the bundle from the same inputs differ"; exit 1; }
          node scripts/mcpb/verify.mjs --bundle "$RUNNER_TEMP/mcpb/iris-eval.mcpb" --tarball "$tarball"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mcpb-bundle
          path: |
            ${{ runner.temp }}/mcpb/*.tgz
            ${{ runner.temp }}/mcpb/iris-eval.mcpb
          retention-days: 3

  # The bundle as a host sees it, on the three platforms and at both ends of
  # the Node range the manifest declares (22.13.0, where node:sqlite starts,
  # and the current line). The reference MCPB tooling (@anthropic-ai/mcpb,
  # an exact devDependency locked in package-lock.json; Claude Desktop uses
  # its unpacker and launch-config code) unpacks and validates it; each
  # runner rebuilds it from the same tarball with its
  # own install and must get the same bytes; then tests/mcpb starts it from
  # the launch config that tooling builds and requires every tool.
  mcpb:
    name: MCPB bundle (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    needs: [mcpb-pack]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22.13.0', 24]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: mcpb-bundle
          path: ${{ runner.temp }}/mcpb
      - name: The reference tooling unpacks it, validates the manifest and reads it
        run: |
          mcpb=./node_modules/.bin/mcpb
          "$mcpb" --version
          "$mcpb" unpack "$RUNNER_TEMP/mcpb/iris-eval.mcpb" "$RUNNER_TEMP/unpacked"
          "$mcpb" validate "$RUNNER_TEMP/unpacked/manifest.json"
          "$mcpb" info "$RUNNER_TEMP/mcpb/iris-eval.mcpb"
      - name: Rebuilt on this runner from the same tarball, the bundle is the same bytes
        run: |
          tarball="$RUNNER_TEMP/mcpb/$(cd "$RUNNER_TEMP/mcpb" && ls -- *.tgz)"
          node scripts/mcpb/pack.mjs --tarball "$tarball" --out "$RUNNER_TEMP/rebuilt.mcpb"
          cmp "$RUNNER_TEMP/mcpb/iris-eval.mcpb" "$RUNNER_TEMP/rebuilt.mcpb" || { echo "::error::the bundle rebuilt on ${{ matrix.os }} (Node ${{ matrix.node-version }}) differs from the one built on Linux"; exit 1; }
      - name: It starts from the host's launch config and lists every tool
        env:
          IRIS_MCPB_BUNDLE: ${{ runner.temp }}/mcpb/iris-eval.mcpb
          IRIS_MCPB_LIB: ${{ github.workspace }}
        run: npx vitest run --config tests/mcpb/vitest.config.ts

  # Claude Desktop runs a Node bundle in its built-in Node — an Electron
  # utility process, not a Node release — whenever that Node satisfies the
  # manifest's range, which is the default. tests/mcpb/electron-host starts
  # the bundle the same way under a pinned Electron and requires every tool
  # and a stored trace. Electron 40.4.1 (Node 24.13.0) is what Claude
  # Desktop 1.1.6679 ships; bump it here to re-verify a newer host. macOS
  # and Windows only: the platforms Claude Desktop runs on.
  #
  # Electron is installed by exact version into a scratch directory, not
  # locked in package-lock.json. It is a test runtime pinned on purpose to
  # an older release (the one the host ships), so the advisories against
  # that release would open as alerts on this repository and fail
  # security-exposure, and a devDependency would download its ~100 MB
  # binary in every `npm ci`. npm checks the package against the registry's
  # integrity hash, and Electron's installer checks the binary against the
  # release's SHASUMS256.txt.
  mcpb-electron:
    name: MCPB bundle in Electron's Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [mcpb-pack]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: mcpb-bundle
          path: ${{ runner.temp }}/mcpb
      - name: Install Electron (exact version)
        run: |
          mkdir -p "$RUNNER_TEMP/electron"
          cd "$RUNNER_TEMP/electron"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --save-exact electron@40.4.1
      - name: The bundle runs in Electron's Node, lists every tool and stores a trace
        run: |
          ./node_modules/.bin/mcpb unpack "$RUNNER_TEMP/mcpb/iris-eval.mcpb" "$RUNNER_TEMP/unpacked"
          npx --prefix "$RUNNER_TEMP/electron" electron tests/mcpb/electron-host/main.mjs "$RUNNER_TEMP/unpacked" "$GITHUB_WORKSPACE"

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: cd dashboard && npm ci --no-audit --no-fund
      # One build: the dashboard, then the server. A local `npm pack`
      # after `npm run build` used to ship a server with no UI because
      # dist/dashboard came from a separate step only CI ran.
      - run: npm run build
      - name: The pack carries the dashboard (F14)
        # What `npm pack` would ship, read from npm itself; `prepack` refuses
        # earlier when dist/dashboard is missing, and this asserts the file
        # is actually in the tarball's list.
        run: |
          npm pack --dry-run --json > pack.json
          jq -e '.[0].files[] | select(.path == "dist/dashboard/index.html")' pack.json > /dev/null \
            || { echo "::error::dist/dashboard/index.html is not in the pack list"; exit 1; }
          echo "pack carries dist/dashboard/index.html"
      - name: The packed tarball resolves ./engine, ./client and ./dist/*
        # What a consumer does: pack, install the tarball into a never-used
        # directory, import each subpath, evaluate one stub through the engine.
        run: node scripts/check-exports.mjs
      - name: Bundle size budget gate
        # Fails if the dashboard's first load (the entry and what it imports
        # up front, read from Vite's build manifest) or any chunk loaded on
        # demand exceeds its budget. Raising a budget requires an explicit
        # commit editing scripts/check-bundle-size.mjs with justification.
        run: node scripts/check-bundle-size.mjs
      - name: Verify package integrity
        run: |
          test -f dist/dashboard/server.js || (echo "FATAL: dist/dashboard/server.js missing after build" && exit 1)
          test -f dist/dashboard/index.html || (echo "FATAL: dist/dashboard/index.html missing after build" && exit 1)
          test -f dist/index.js || (echo "FATAL: dist/index.js missing after build" && exit 1)
          node dist/index.js --help > /dev/null 2>&1
          echo "Package integrity check passed"

  # Security-alert delta gate. Fails the PR if any open Dependabot alert at
  # severity >= medium does not have a corresponding GHSA-* row in
  # SECURITY-EXPOSURE.md. Forces every new alert to be triaged with a
  # documented decision (override / dismiss / track / patch) instead of
  # accumulating silently. See also SECURITY-EXPOSURE.md operational notes.
  security-exposure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Check exposure coverage
        run: node scripts/security/check-exposure-coverage.mjs

  # Smoke-build the Dockerfile on every PR. The host build (`build` job)
  # passes whenever tsc + vite succeed, but the Docker image runs tsc inside
  # a context that excludes hidden/un-COPY'd files. The v0.4.1 incident
  # shipped npm but not Docker because a dead-code import of `.claims.json`
  # typechecked on host (file present in repo) but failed in Docker (file
  # not COPY'd into builder stage). This gate runs single-arch (linux/amd64)
  # with gha cache so it stays under ~2min on warm runs.
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Smoke build (single-arch, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          # load: true so the image lands in the local daemon and the step
          # below can RUN it. With load:false this job proved the image
          # BUILDS and nothing more — an image that builds and then exits 1
          # on start passed the gate cleanly.
          load: true
          tags: iris-eval/mcp-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the image — does it actually start?
        # --self-test exercises boot, storage init, the eval engine (PII and
        # injection positives), a dashboard bind and the rebinding guard,
        # then exits non-zero on any failure. Runs as the image's own
        # unprivileged `iris` user, which is how it will actually run.
        #
        # NOT sufficient alone: --self-test builds its OWN config and never
        # calls loadConfig, so it cannot see a broken ENV block. It passes
        # happily on an image whose shipped CMD exits 1 on a port collision.
        # The step below is the one that catches that.
        run: docker run --rm iris-eval/mcp-server:ci node dist/index.js --self-test

      - name: Run the image AS SHIPPED — default CMD, both ports answering
        # The gate the DOA image walked through for four months. This runs no
        # command of its own: it starts the container exactly as `docker run
        # ghcr.io/iris-eval/mcp-server` does, publishes the two documented
        # ports, and requires both servers to answer THROUGH the published
        # mapping — which also proves the in-container bind address is
        # reachable, since loopback inside a container is not.
        run: |
          set -euo pipefail
          echo "--- bare run must REFUSE: the image binds 0.0.0.0 and carries no key ---"
          # The image's own ENV puts both servers on 0.0.0.0; with no
          # IRIS_API_KEY the process must stop at boot with one sentence
          # naming the variable, not serve. `|| true` captures the exit
          # code instead of tripping -e; the assertion is the next line.
          bare_rc=0
          bare_log=$(docker run --rm iris-eval/mcp-server:ci 2>&1) || bare_rc=$?
          echo "$bare_log" | tail -3
          if [ "$bare_rc" -eq 0 ]; then
            echo "::error::a bare docker run served without a key — the bind policy did not refuse"
            exit 1
          fi
          echo "$bare_log" | grep -q "IRIS_API_KEY" || { echo "::error::the refusal does not name IRIS_API_KEY"; exit 1; }
          echo "$bare_log" | grep -q "IRIS_ALLOW_UNAUTHENTICATED" || { echo "::error::the refusal does not name the override"; exit 1; }
          echo "bare run refused with exit $bare_rc, naming both variables"
          echo "--- keyed run must SERVE: both documented ports through the published mapping ---"
          docker run -d --name iris-ci -p 3000:3000 -p 6920:6920 -e IRIS_API_KEY=ci-smoke-key iris-eval/mcp-server:ci
          ready=""
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:6920/api/v1/health"; then ready=1; break; fi
            if [ -z "$(docker ps --filter name=iris-ci --filter status=running -q)" ]; then
              echo "::error::container exited before becoming ready — as shipped, this image does not start"
              docker logs iris-ci
              exit 1
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::dashboard never answered on the published port"
            docker logs iris-ci
            docker rm -f iris-ci
            exit 1
          fi
          echo "--- dashboard health ---"
          curl -fsS "http://127.0.0.1:6920/api/v1/health"
          echo ""
          echo "--- one health contract on both ports ---"
          # The MCP port's /health and the dashboard's /api/v1/health are
          # built by one function; both must carry the checks block and
          # name the driver. A probe that reads only the status code must
          # get 200 here too.
          for url in "http://127.0.0.1:3000/health" "http://127.0.0.1:6920/api/v1/health"; do
            body=$(curl -fsS "$url")
            echo "$body" | grep -q '"checks":{' || { echo "::error::$url carries no checks block: $body"; docker rm -f iris-ci; exit 1; }
            echo "$body" | grep -q '"migrations":{"status":"ok"' || { echo "::error::$url does not report migrations ok: $body"; docker rm -f iris-ci; exit 1; }
            echo "$body" | grep -q '"driver":"better-sqlite3"' || { echo "::error::$url does not name the driver: $body"; docker rm -f iris-ci; exit 1; }
          done
          echo "both ports report checks, migrations ok, and the driver"
          echo "--- the image's own HEALTHCHECK must reach healthy ---"
          # start-period 20 s, interval 30 s: allow one interval past the
          # start period before calling it a failure.
          state=""
          for _ in $(seq 1 40); do
            state=$(docker inspect --format '{{.State.Health.Status}}' iris-ci 2>/dev/null || echo "none")
            [ "$state" = "healthy" ] && break
            sleep 2
          done
          if [ "$state" != "healthy" ]; then
            echo "::error::HEALTHCHECK state is '$state' after 80 s — the probe in the Dockerfile does not reach /health"
            docker inspect --format '{{json .State.Health}}' iris-ci || true
            docker rm -f iris-ci
            exit 1
          fi
          echo "HEALTHCHECK: $state"
          echo "--- OCI labels: the package page and docker inspect read these ---"
          for label in org.opencontainers.image.source org.opencontainers.image.description org.opencontainers.image.licenses; do
            value=$(docker inspect --format "{{index .Config.Labels \"$label\"}}" iris-eval/mcp-server:ci)
            [ -n "$value" ] || { echo "::error::the image carries no $label label"; docker rm -f iris-ci; exit 1; }
            echo "$label = $value"
          done
          echo "--- MCP transport must answer on its own port (any HTTP status proves a live listener) ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000/mcp" || true)
          echo "GET /mcp -> $code"
          docker rm -f iris-ci
          test "$code" != "000"

      - name: The volume holds the Iris home — a deployed rule and its audit row survive a new container
        # Until 0.20.0 the image pointed only IRIS_DB_PATH into /data; the
        # Iris home (custom-rules.json, audit.log, config.json) stayed in the
        # container layer, so recreating the container kept the traces and
        # dropped the deployed rules and the audit trail. This deploys a rule
        # through the API, replaces the container with a new one on the same
        # volume, and requires the new one to serve the rule and its audit row.
        run: |
          set -euo pipefail
          key=ci-persist-key
          base=http://127.0.0.1:6920
          docker volume create iris-ci-home > /dev/null
          start() {
            docker run -d --name "$1" -p 6920:6920 -e IRIS_API_KEY="$key" -v iris-ci-home:/data iris-eval/mcp-server:ci > /dev/null
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null "$base/api/v1/health"; then return 0; fi
              sleep 2
            done
            echo "::error::$1 never answered"; docker logs "$1"; return 1
          }
          start iris-home-a
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/v1/rules/custom" \
            -H "authorization: Bearer $key" -H 'content-type: application/json' \
            -d '{"name":"ci-persist","evalType":"completeness","severity":"medium","definition":{"name":"ci-persist","type":"min_length","config":{"min":10}}}')
          [ "$code" = 201 ] || { echo "::error::deploying the rule answered HTTP $code"; docker rm -f iris-home-a; exit 1; }
          docker rm -f iris-home-a > /dev/null
          start iris-home-b
          rules=$(curl -fsS "$base/api/v1/rules/custom" -H "authorization: Bearer $key")
          audit=$(curl -fsS "$base/api/v1/audit?limit=50" -H "authorization: Bearer $key")
          docker exec iris-home-b ls -la /data
          docker rm -f iris-home-b > /dev/null
          docker volume rm iris-ci-home > /dev/null
          echo "$rules" | grep -q '"name":"ci-persist"' || { echo "::error::the deployed rule did not survive a new container: $rules"; exit 1; }
          echo "$audit" | grep -q 'ci-persist' || { echo "::error::the audit row did not survive a new container: $audit"; exit 1; }
          echo "a new container on the same volume serves the rule and its audit row"

  # Directories that build Iris from a clone (Glama runs `pnpm install &&
  # pnpm run build`, then starts the server and reads tools/list) failed for
  # three weeks after the dashboard joined `build`, and no job here built
  # that way. This one does, from the fresh checkout, with pnpm and no
  # dashboard install of its own, then requires every tool to be listed.
  fresh-clone-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - run: npm install -g pnpm@10
      - run: pnpm install && pnpm run build
      - run: node scripts/check-tools-listed.mjs

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: cd dashboard && npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install Playwright browsers (Chromium + Firefox)
        # WebKit on Linux is NOT Safari (Safari uses Apple's WebKit,
        # macOS-only). We run Chromium + Firefox for real evergreen
        # coverage; Safari-real would require macOS CI as a later
        # decision. See playwright.config.ts for the full rationale.
        run: npx playwright install --with-deps chromium firefox
      - name: Run Playwright E2E (Chromium + Firefox)
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # proof/results.json and proof/RESULTS.md carry every built-in rule's
  # precision / recall / F1 on the labelled corpus in proof/corpus/. This
  # job regenerates both from the code in the PR and fails on any byte of
  # difference (generation time and commit hash excluded), so a rule change
  # cannot land without the published numbers changing with it, and the
  # numbers on the website (via .claims.json → proof) are always the ones
  # this commit produces. Offline, deterministic, no key. Same shape as the
  # "Truthbase regen vs committed" job in claims-alignment.yml.
  proof:
    name: Proof — rule accuracy regen vs committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck the runner
        run: npm run proof:typecheck
      - name: Regenerate the measurement and compare with the committed files
        run: npm run proof -- --check
      - name: Proof — the verdict on the composite corpus (regen vs committed)
        run: npm run proof -- --check --composite
      # The only OUT-OF-SAMPLE line: 24 agent runs captured before the rules
      # that judge them existed. It also regenerates the GAP SET that
      # tests/real-transcripts.test.ts reads, so a gap that closes cannot
      # stay recorded as open.
      - name: Proof — the 24 real transcripts (regen vs committed)
        run: npm run proof -- --check --transcripts
      - name: Publish the table to the job summary
        if: always()
        run: cat proof/RESULTS.md >> "$GITHUB_STEP_SUMMARY"

  # The gate action, dogfooded: the composite action under
  # .github/actions/gate runs this checkout's own build against the
  # walk-through fixtures — the leak is caught, the clean file passes, the
  # receipt reaches the job summary, and on a pull request one comment is
  # posted and then updated in place; on a push it posts nothing, asserted.
  gate-action:
    name: Gate action — dogfood
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    permissions:
      contents: read
      pull-requests: write   # the action posts the receipt as one PR comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: cd dashboard && npm ci --no-audit --no-fund
      - run: npm run build
      - name: Seed the dataset the gate reads
        run: node scripts/ci/seed-gate-dataset.mjs
        env:
          IRIS_HOME: ${{ runner.temp }}/iris-gate-home
      - name: The gate on the walk-through traces (one leak inside the dataset, one outside)
        id: leak
        uses: ./.github/actions/gate
        continue-on-error: true
        with:
          traces: tests/fixtures/ci-gate/traces.ndjson
          fail-on: detector_veto
          dataset: release-gate
          iris-home: ${{ runner.temp }}/iris-gate-home
          command: node dist/index.js
      - name: The gate on a clean file
        id: clean
        uses: ./.github/actions/gate
        with:
          traces: tests/fixtures/ci-gate/clean.ndjson
          fail-on: any
          iris-home: ${{ runner.temp }}/iris-gate-home
          command: node dist/index.js
      - name: The gate on the same traces again — the comment is updated, not duplicated
        id: again
        uses: ./.github/actions/gate
        continue-on-error: true
        with:
          traces: tests/fixtures/ci-gate/traces.ndjson
          fail-on: detector_veto
          dataset: release-gate
          iris-home: ${{ runner.temp }}/iris-gate-home
          command: node dist/index.js
      - name: What the three runs said
        env:
          LEAK_OUTCOME: ${{ steps.leak.outcome }}
          LEAK_EXIT: ${{ steps.leak.outputs.exit-code }}
          LEAK_STORED: ${{ steps.leak.outputs.stored }}
          LEAK_TRIPPED: ${{ steps.leak.outputs.tripped }}
          LEAK_GATED: ${{ steps.leak.outputs.gated }}
          LEAK_COMMENT: ${{ steps.leak.outputs.comment }}
          CLEAN_EXIT: ${{ steps.clean.outputs.exit-code }}
          CLEAN_STORED: ${{ steps.clean.outputs.stored }}
          CLEAN_TRIPPED: ${{ steps.clean.outputs.tripped }}
          AGAIN_COMMENT: ${{ steps.again.outputs.comment }}
          EVENT: ${{ github.event_name }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$LEAK_OUTCOME" = "failure" ] || fail "the leak run should fail the step, got outcome $LEAK_OUTCOME"
          [ "$LEAK_EXIT" = "1" ] || fail "the leak run should exit 1, got $LEAK_EXIT"
          [ "$LEAK_STORED" = "3" ] || fail "three traces stored, got $LEAK_STORED"
          [ "$LEAK_TRIPPED" = "1" ] || fail "one verdict tripped inside the dataset, got $LEAK_TRIPPED"
          [ "$LEAK_GATED" = "2" ] || fail "two of three in the dataset's gate, got $LEAK_GATED"
          [ "$CLEAN_EXIT" = "0" ] || fail "the clean run should exit 0, got $CLEAN_EXIT"
          [ "$CLEAN_STORED" = "1" ] && [ "$CLEAN_TRIPPED" = "0" ] || fail "the clean run: $CLEAN_STORED stored, $CLEAN_TRIPPED tripped"
          if [ "$EVENT" = "pull_request" ]; then
            case "$LEAK_COMMENT" in posted|updated) ;; *) fail "on a pull request the first run should post or update the comment, got $LEAK_COMMENT" ;; esac
            [ "$AGAIN_COMMENT" = "updated" ] || fail "the second run on the same traces should update the comment in place, got $AGAIN_COMMENT"
          else
            [ "$LEAK_COMMENT" = "skipped-not-pr" ] || fail "outside a pull request the comment is skipped-not-pr, got $LEAK_COMMENT"
            [ "$AGAIN_COMMENT" = "skipped-not-pr" ] || fail "outside a pull request the comment is skipped-not-pr, got $AGAIN_COMMENT"
          fi
          echo "gate action: leak caught (exit 1, 1 of 2 tripped), clean passed (exit 0), comment: $LEAK_COMMENT then $AGAIN_COMMENT"

  # The Python client: packages/python against a server this
  # checkout builds — the contract test on every door with a key, the
  # pytest plugin's own tests, and the wheel installed into a fresh
  # environment — on every Python the package claims.
  #
  # The same job proves wrap_openai / wrap_anthropic end to end: the official
  # openai and anthropic packages (from the test extras), wrapped, against the
  # scripted provider in tests/fixtures/scripted-provider, each call required
  # to arrive in a real Iris server with its input, output, usage and verdict
  # (tests/test_wrappers_e2e.py; IRIS_E2E=1 makes a missing prerequisite a
  # failure, not a skip). One cell runs them on the oldest provider SDKs the
  # extras allow. And the LangChain handler: a real LangGraph app with a
  # scripted model, each run arriving as one trace with its tool call and a
  # verdict (tests/test_langchain_e2e.py), and the OpenTelemetry route run for
  # real, LangSmith's own export of the same graph posted to Iris exactly as
  # docs/otel-recipes.md says (tests/test_langsmith_otel_e2e.py).
  python-client:
    name: Python client (${{ matrix.python }}${{ matrix.sdks == 'oldest' && ', oldest provider SDKs' || '' }})
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
        sdks: [latest]
        include:
          - python: '3.12'
            sdks: oldest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: cd dashboard && npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start a keyed server for the contract test
        env:
          IRIS_HOME: ${{ runner.temp }}/iris-py
          IRIS_NO_AUTO_LAUNCH: '1'
        run: |
          nohup node dist/index.js --transport http --port 6931 --dashboard --dashboard-port 6930 --api-key py-contract-key > "$RUNNER_TEMP/iris-py.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:6930/api/v1/health > /dev/null 2>&1; then echo "server up after $i tries"; break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:6930/api/v1/health || { cat "$RUNNER_TEMP/iris-py.log"; exit 1; }
      - name: Install the package with its test extras
        run: python -m pip install --quiet --upgrade pip build && python -m pip install --quiet -e "packages/python[test]"
      - name: The oldest provider SDKs the test extras allow
        if: matrix.sdks == 'oldest'
        run: python -m pip install --quiet "openai==1.66.0" "anthropic==0.43.0" && python -m pip show openai anthropic | grep -E '^(Name|Version)'
      - name: The client's tests — the fake server, the plugin, the contract against the live one, and the wrappers end to end
        env:
          IRIS_URL: http://127.0.0.1:6930
          IRIS_API_KEY: py-contract-key
          IRIS_E2E: '1'
        run: python -m pytest packages/python -q -rs
      - name: The wheel builds and installs into a fresh environment
        run: |
          python -m build packages/python --outdir "$RUNNER_TEMP/py-dist"
          python -m venv "$RUNNER_TEMP/fresh"
          "$RUNNER_TEMP/fresh/bin/pip" install --quiet "$RUNNER_TEMP"/py-dist/*.whl
          "$RUNNER_TEMP/fresh/bin/python" -c "import iris_eval; from importlib.metadata import entry_points; eps = [e for e in entry_points(group='pytest11') if e.name == 'iris_eval']; assert eps, 'the pytest11 entry point is missing'; print('iris-eval', iris_eval.__version__, 'plugin entry point', eps[0].value)"
      - name: The server's log, on failure
        if: failure()
        run: cat "$RUNNER_TEMP/iris-py.log" || true

  # The JavaScript SDK (packages/sdk, @iris-eval/sdk): the official openai
  # and @anthropic-ai/sdk clients, wrapped, against the scripted provider in
  # tests/fixtures/scripted-provider, and the `ai` package's generateText /
  # streamText through irisMiddleware — each call required to arrive in a
  # real Iris server built from this checkout with its input, output, token
  # usage and verdict. No key; the same result every run. Then the package as
  # a consumer gets it: packed, installed into an empty project beside
  # openai, and loaded by both import and require. The package is private and
  # not yet published: this job is its proof, and it uploads nothing.
  sdk-js:
    name: JavaScript SDK (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/sdk/package-lock.json
      - run: npm ci
      - name: The server the tests send to
        run: npm run build:server
      - run: cd packages/sdk && npm ci --no-audit --no-fund
      - run: cd packages/sdk && npm run build && npm run typecheck
      - name: The wrappers and the middleware, end to end against a real Iris
        run: cd packages/sdk && npm test
      - name: Packed, installed into an empty project, loaded by import and by require
        run: |
          set -euo pipefail
          cd packages/sdk
          npm pack --pack-destination "$RUNNER_TEMP"
          tarball="$(ls "$RUNNER_TEMP"/iris-eval-sdk-*.tgz)"
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$tarball" openai
          node --input-type=module -e "import { wrapOpenAI } from '@iris-eval/sdk'; import OpenAI from 'openai'; const c = wrapOpenAI(new OpenAI({ apiKey: 'x' })); if (!(c instanceof OpenAI)) process.exit(1); console.log('import: ok');"
          node -e "const { wrapOpenAI, IrisRecorder } = require('@iris-eval/sdk'); if (typeof wrapOpenAI !== 'function' || typeof IrisRecorder !== 'function') process.exit(1); console.log('require: ok');"
          node -e "const deps = require('./node_modules/@iris-eval/sdk/package.json').dependencies ?? {}; if (Object.keys(deps).length) { console.error('runtime dependencies:', deps); process.exit(1); } console.log('no runtime dependencies');"

  # The LangChain.js integration (packages/langchain, @iris-eval/langchain):
  # a real LangGraph.js app — the tool loop in test/langgraph-app.ts, a
  # scripted chat model — run with IrisCallbackHandler in its callbacks, each
  # run required to arrive in a real Iris server built from this commit as
  # one trace with its tool call, token usage and verdict. Then the package
  # as a consumer gets it: packed with @iris-eval/sdk, installed into an empty
  # project beside @langchain/core, loaded by import and by require. Both
  # packages are private and not yet published: this job is their proof, and
  # it uploads nothing.
  langchain-js:
    name: LangChain.js integration (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/sdk/package-lock.json
            packages/langchain/package-lock.json
      - run: npm ci
      - name: The server the tests send to
        run: npm run build:server
      - name: The recorder it builds on
        run: cd packages/sdk && npm ci --no-audit --no-fund && npm run build
      - run: cd packages/langchain && npm ci --no-audit --no-fund
      - run: cd packages/langchain && npm run build && npm run typecheck
      - name: A real LangGraph.js app, end to end against a real Iris
        run: cd packages/langchain && npm test
      - name: Packed, installed into an empty project, loaded by import and by require
        run: |
          set -euo pipefail
          (cd packages/sdk && npm pack --pack-destination "$RUNNER_TEMP")
          (cd packages/langchain && npm pack --pack-destination "$RUNNER_TEMP")
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/iris-eval-sdk-*.tgz @langchain/core
          npm install --no-audit --no-fund --no-save "$RUNNER_TEMP"/iris-eval-langchain-*.tgz
          node --input-type=module -e "import { IrisCallbackHandler } from '@iris-eval/langchain'; const h = new IrisCallbackHandler(); if (h.name !== 'iris-eval') process.exit(1); console.log('import: ok');"
          node -e "const { IrisCallbackHandler } = require('@iris-eval/langchain'); if (typeof IrisCallbackHandler !== 'function') process.exit(1); console.log('require: ok');"
