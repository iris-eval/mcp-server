name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Top-level least-privilege default. Individual jobs override when they
# need more (e.g., security-exposure declares contents:read; no job in
# this workflow needs write). Closes Scorecard Token-Permissions.
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: bash scripts/check-version.sh
      - run: bash scripts/check-product-claims.sh
      # The LLM-facing surface (website/public/llms*.txt) must be the render
      # of its template + .claims.json — see scripts/claims/render-llms.mjs.
      - run: npm run llms:check
      # NOTE: `npm audit --audit-level=high` used to run here. It was removed
      # 2026-08-06 because it could deadlock the repo against itself.
      #
      # A raw audit exit code fails on the WHOLE set of open advisories, so
      # with N>1 independent HIGHs outstanding, every PR went red — including
      # each Dependabot PR that fixed one of them, because the other N-1
      # remained. No single PR could turn it green, so nothing could merge,
      # so the advisories could never drain. That is exactly what happened:
      # 4 HIGHs (brace-expansion, fast-uri, ip-address, postcss) blocked all
      # 40 open PRs at once.
      #
      # THE INVARIANT (do not reintroduce a gate that violates it):
      #   A blocking gate must always be satisfiable by a change made INSIDE
      #   the pull request it is blocking. If clearing it requires some OTHER
      #   pull request to merge first, the gate can deadlock.
      #
      # Dependency-security enforcement lives in the `security-exposure` job,
      # which is strictly stronger AND deadlock-free: it runs on the same PR
      # trigger, covers >=moderate (a lower threshold than high), and demands
      # a documented threat-model decision per advisory. Both of its exits —
      # add a triage row, or bump the dep — are edits inside the PR itself.
      - run: npm run lint
      - run: npm run typecheck
      # npm install (not ci) because lockfile is generated on Windows and
      # rolldown/emnapi transitive optional deps for Linux aren't captured.
      # Versions are constrained by ^carets in dashboard/package.json.
      # See memory: reference_rolldown_lockfile_trap.md
      - run: cd dashboard && npm install --no-audit --no-fund && npm run typecheck && npm run lint && npm test
      # Storybook smoke (audit item #11): build catalog to catch broken
      # stories before they ship. No pixel regression yet — Chromatic/
      # lost-pixel vendor choice is a separate founder decision.
      - run: cd dashboard && npm run build-storybook

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Coverage gate: enforces the ratchet floors in vitest.config.ts
      # (a plain `npm test` run would leave the thresholds unenforced).
      - run: npm run test:coverage

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:integration

  # The website previously had NO CI gate at all — Vercel builds it without
  # linting, and 26 lint errors accumulated invisibly (found 2026-07-07).
  # This job makes website lint + typecheck a first-class check.
  website-lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: cd website && npm ci
      - run: cd website && npm run lint
      - run: cd website && npx tsc --noEmit

  # packages/init is an in-repo npm package (@iris-eval/init — NOT yet on the
  # npm registry; `npm view` 404s as of 2026-09-03, see .claims.json
  # version.published) that had NO PR gate at all — breaks landed invisibly
  # and first surfaced inside the tag-triggered release-init.yml job, which
  # holds the OIDC publishing identity (issue #335). This job runs the same
  # typecheck + test + build that release-init.yml depends on, on every PR.
  init-typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/init/package-lock.json
      - run: cd packages/init && npm ci
      - run: cd packages/init && npm run typecheck
      - run: cd packages/init && npm test
      - run: cd packages/init && npm run build

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: cd dashboard && npm install --no-audit --no-fund && npm run build
      - name: Bundle size budget gate
        # Fails if dashboard JS/CSS exceeds the declared budget. Raising
        # budgets requires an explicit commit editing
        # scripts/check-bundle-size.mjs with justification.
        run: node scripts/check-bundle-size.mjs
      - name: Verify package integrity
        run: |
          test -f dist/dashboard/server.js || (echo "FATAL: dist/dashboard/server.js missing after build" && exit 1)
          test -f dist/dashboard/index.html || (echo "FATAL: dist/dashboard/index.html missing after build" && exit 1)
          test -f dist/index.js || (echo "FATAL: dist/index.js missing after build" && exit 1)
          node dist/index.js --help > /dev/null 2>&1
          echo "Package integrity check passed"

  # Security-alert delta gate. Fails the PR if any open Dependabot alert at
  # severity >= medium does not have a corresponding GHSA-* row in
  # SECURITY-EXPOSURE.md. Forces every new alert to be triaged with a
  # documented decision (override / dismiss / track / patch) instead of
  # accumulating silently. See also SECURITY-EXPOSURE.md operational notes.
  security-exposure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Check exposure coverage
        run: node scripts/security/check-exposure-coverage.mjs

  # Smoke-build the Dockerfile on every PR. The host build (`build` job)
  # passes whenever tsc + vite succeed, but the Docker image runs tsc inside
  # a context that excludes hidden/un-COPY'd files. The v0.4.1 incident
  # shipped npm but not Docker because a dead-code import of `.claims.json`
  # typechecked on host (file present in repo) but failed in Docker (file
  # not COPY'd into builder stage). This gate runs single-arch (linux/amd64)
  # with gha cache so it stays under ~2min on warm runs.
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Smoke build (single-arch, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          # load: true so the image lands in the local daemon and the step
          # below can RUN it. With load:false this job proved the image
          # BUILDS and nothing more — an image that builds and then exits 1
          # on start passed the gate cleanly.
          load: true
          tags: iris-eval/mcp-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the image — does it actually start?
        # --self-test exercises boot, storage init, the eval engine (PII and
        # injection positives), a dashboard bind and the rebinding guard,
        # then exits non-zero on any failure. Runs as the image's own
        # unprivileged `iris` user, which is how it will actually run.
        #
        # NOT sufficient alone: --self-test builds its OWN config and never
        # calls loadConfig, so it cannot see a broken ENV block. It passes
        # happily on an image whose shipped CMD exits 1 on a port collision.
        # The step below is the one that catches that.
        run: docker run --rm iris-eval/mcp-server:ci node dist/index.js --self-test

      - name: Run the image AS SHIPPED — default CMD, both ports answering
        # The gate the DOA image walked through for four months. This runs no
        # command of its own: it starts the container exactly as `docker run
        # ghcr.io/iris-eval/mcp-server` does, publishes the two documented
        # ports, and requires both servers to answer THROUGH the published
        # mapping — which also proves the in-container bind address is
        # reachable, since loopback inside a container is not.
        run: |
          set -euo pipefail
          docker run -d --name iris-ci -p 3000:3000 -p 6920:6920 iris-eval/mcp-server:ci
          ready=""
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:6920/api/v1/health"; then ready=1; break; fi
            if [ -z "$(docker ps --filter name=iris-ci --filter status=running -q)" ]; then
              echo "::error::container exited before becoming ready — as shipped, this image does not start"
              docker logs iris-ci
              exit 1
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::dashboard never answered on the published port"
            docker logs iris-ci
            docker rm -f iris-ci
            exit 1
          fi
          echo "--- dashboard health ---"
          curl -fsS "http://127.0.0.1:6920/api/v1/health"
          echo ""
          echo "--- MCP transport must answer on its own port (any HTTP status proves a live listener) ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000/mcp" || true)
          echo "GET /mcp -> $code"
          docker rm -f iris-ci
          test "$code" != "000"

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: cd dashboard && npm install --no-audit --no-fund && npm run build
      - name: Install Playwright browsers (Chromium + Firefox)
        # WebKit on Linux is NOT Safari (Safari uses Apple's WebKit,
        # macOS-only). We run Chromium + Firefox for real evergreen
        # coverage; Safari-real would require macOS CI as a later
        # decision. See playwright.config.ts for the full rationale.
        run: npx playwright install --with-deps chromium firefox
      - name: Run Playwright E2E (Chromium + Firefox)
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # proof/results.json and proof/RESULTS.md carry every built-in rule's
  # precision / recall / F1 on the labelled corpus in proof/corpus/. This
  # job regenerates both from the code in the PR and fails on any byte of
  # difference (generation time and commit hash excluded), so a rule change
  # cannot land without the published numbers changing with it, and the
  # numbers on the website (via .claims.json → proof) are always the ones
  # this commit produces. Offline, deterministic, no key. Same shape as the
  # "Truthbase regen vs committed" job in claims-alignment.yml.
  proof:
    name: Proof — rule accuracy regen vs committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck the runner
        run: npm run proof:typecheck
      - name: Regenerate the measurement and compare with the committed files
        run: npm run proof -- --check
      - name: Proof — the verdict on the composite corpus (regen vs committed)
        run: npm run proof -- --check --composite
      # The only OUT-OF-SAMPLE line: 24 agent runs captured before the rules
      # that judge them existed. It also regenerates the GAP SET that
      # tests/real-transcripts.test.ts reads, so a gap that closes cannot
      # stay recorded as open.
      - name: Proof — the 24 real transcripts (regen vs committed)
        run: npm run proof -- --check --transcripts
      - name: Publish the table to the job summary
        if: always()
        run: cat proof/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
