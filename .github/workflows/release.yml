name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual dispatch lets us re-run a release for an existing tag after
  # recovering from a failed earlier run (e.g., rotated credentials).
  # Trigger with: `gh workflow run release.yml --ref vX.Y.Z`. The dispatched
  # workflow's github.ref/ref_name resolve to the tag, so the rest of the
  # workflow logic (npm-tag, Docker tags, SBOM names, prerelease detection)
  # works identically to the push-trigger path.
  workflow_dispatch: {}

# OIDC migration (audit item #9): `id-token: write` grants the workflow a
# GitHub-signed identity token. npm uses it for BOTH provenance attestation
# (--provenance) AND publish authentication via npm Trusted Publishing — the
# package is configured on npmjs.com with this repo + release.yml as a trusted
# publisher (org-side, set 2026-06-12), so no NPM_TOKEN secret is needed. The
# long-lived NPM_TOKEN was removed after it silently expired and a swallowed
# 404 caused v0.4.3 to never reach npm (see PR #176 + the 2026-06-12 incident).
# Trusted Publishing requires npm >= 11.5.1 (upgraded in the publish-npm job;
# Node 22 ships npm 10.x). cosign also uses this OIDC token for keyless signing.
#
# Least-privilege: top-level is contents:read (default for all jobs).
# Each publishing / release job declares its specific writes at job level.
# Closes Scorecard Token-Permissions (workflow-level minimal default).
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run clean
      - run: npm run build

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read         # checkout
      id-token: write        # npm --provenance + attest-build-provenance
      attestations: write    # attest-build-provenance writes attestation
    outputs:
      sbom-path: ${{ steps.sbom.outputs.fileName }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      # Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.x.
      # Without this upgrade `npm publish` cannot perform the OIDC token exchange
      # and — with NPM_TOKEN now gone — would fail auth outright.
      # Pinned to an exact version, not `@latest`: a release job that installs
      # whatever npm publishes at tag-time takes an untested (and unreviewable)
      # supply-chain dependency on the npm CLI right before it publishes with
      # our OIDC identity. Bump deliberately; keep it >= 11.5.1.
      - name: Upgrade npm for Trusted Publishing (OIDC, >= 11.5.1)
        run: |
          npm install -g npm@11.19.0
          npm --version
      - run: npm ci
      - run: npm run clean
      - run: npm run build
      # NOTE: dashboard uses `npm install` not `npm ci` because the Windows-
      # generated lockfile prunes Linux-only @emnapi transitive deps that
      # rolldown needs (per memory/reference_rolldown_lockfile_trap.md +
      # the M08 fix in the regular CI workflow).
      - run: cd dashboard && npm install && npm run build
      - name: Verify package integrity
        run: |
          test -f dist/dashboard/server.js || (echo "FATAL: dist/dashboard/server.js missing after build" && exit 1)
          test -f dist/dashboard/index.html || (echo "FATAL: dist/dashboard/index.html missing after build" && exit 1)
          test -f dist/index.js || (echo "FATAL: dist/index.js missing after build" && exit 1)
          node dist/index.js --help > /dev/null 2>&1
          echo "Package integrity check passed"

      # SBOM (audit item #8): SPDX JSON covers every direct + transitive
      # dependency in the shipped tarball. Attached to the GitHub release
      # so acquirers + enterprise procurement can verify supply chain.
      - name: Generate npm package SBOM
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: iris-npm-${{ github.ref_name }}.spdx.json
          upload-artifact: true
          output-file: iris-npm-sbom.spdx.json

      # Determine the npm dist-tag based on the git tag.
      # - vX.Y.Z        → latest  (production release)
      # - vX.Y.Z-rc.N   → next    (release candidate; NOT the default install)
      # - anything else → next    (fail-safe; never overwrite latest accidentally)
      - name: Determine npm dist-tag
        id: npm-tag
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "Publishing as 'latest' (production release)"
          else
            echo "tag=next" >> "$GITHUB_OUTPUT"
            echo "Publishing as 'next' (pre-release: ${GITHUB_REF_NAME})"
          fi

      # Idempotent re-runs (e.g., workflow_dispatch on a tag whose earlier run
      # failed) must succeed on EPUBLISHCONFLICT (version already exists) but
      # must FAIL LOUDLY on auth errors, network errors, or anything else.
      # The previous `npm publish ... || echo "skipping"` swallowed an
      # NPM_TOKEN auth 404 silently, producing a "successful" workflow run
      # that did not publish v0.4.3 — see PR #176 incident notes.
      # Auth is via npm Trusted Publishing (OIDC) — no NODE_AUTH_TOKEN. npm
      # exchanges the GitHub id-token for a short-lived publish credential
      # because this repo + release.yml is a configured trusted publisher on
      # npmjs.com. `--provenance` is auto-enabled under Trusted Publishing but
      # kept explicit for clarity.
      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          set -o pipefail
          publish_log=$(mktemp)
          if npm publish --provenance --access public --tag ${{ steps.npm-tag.outputs.tag }} 2>&1 | tee "$publish_log"; then
            echo "✓ npm publish succeeded"
          else
            exit_code=$?
            if grep -qE "EPUBLISHCONFLICT|cannot publish over the previously published" "$publish_log"; then
              echo "✓ Version already published on npm — idempotent re-run, continuing"
            else
              echo "✗ npm publish failed with non-conflict error (exit ${exit_code})"
              echo "  Check: Trusted Publisher config on npmjs.com (repo + workflow filename must match), npm >= 11.5.1, id-token: write permission, registry-side outage."
              exit "${exit_code}"
            fi
          fi

      # Attestation (SLSA provenance): separate from `npm publish
      # --provenance` attestation — this one covers the checked-out source
      # tree and any extra artifacts we publish (SBOM).
      - name: Attest npm SBOM
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: iris-npm-sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: npm-sbom
          path: iris-npm-sbom.spdx.json
          retention-days: 90

  publish-docker:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read         # checkout
      packages: write        # GHCR push
      id-token: write        # cosign keyless + attest-build-provenance
      attestations: write    # push attestation to registry
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Determine Docker tag strategy: pre-releases don't get :latest
      # so `docker pull ghcr.io/...:latest` keeps returning the previous
      # production release, not an RC. Exactly mirrors the npm dist-tag
      # decision above.
      - name: Determine Docker tags
        id: docker-tags
        run: |
          TAGS="ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS="${TAGS}
          ghcr.io/${{ github.repository }}:latest"
            echo "Tagging as :${GITHUB_REF_NAME} + :latest (production)"
          else
            echo "Tagging as :${GITHUB_REF_NAME} only (pre-release — :latest untouched)"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build + push multi-arch image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          # Attach provenance + SBOM attestations to the manifest so
          # `docker buildx imagetools inspect` shows them. Redundant with
          # the cosign signature below but gives two independent trust
          # paths (docker-native + sigstore).
          provenance: mode=max
          sbom: true

      # Cosign keyless signing (audit item #8). Uses the workflow's GitHub
      # OIDC identity — no long-lived signing key to manage. Verified via
      # `cosign verify ghcr.io/iris-eval/mcp-server:vX.Y.Z
      #    --certificate-identity-regexp=https://github.com/iris-eval/mcp-server
      #    --certificate-oidc-issuer=https://token.actions.githubusercontent.com`.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign Docker image by digest
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      # Per-image SBOM. We already inlined `sbom: true` on the buildx
      # action above (image-attached SBOM), but a standalone SPDX file
      # is what enterprise procurement usually asks for.
      - name: Generate Docker image SBOM
        id: sbom-docker
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: spdx-json
          output-file: iris-docker-sbom.spdx.json
          upload-artifact: true
          artifact-name: iris-docker-${{ github.ref_name }}.spdx.json

      - name: Attest Docker SBOM
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload Docker SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docker-sbom
          path: iris-docker-sbom.spdx.json
          retention-days: 90

  github-release:
    needs: [publish-npm, publish-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # softprops/action-gh-release creates the release
      id-token: write        # cosign sign-blob keyless OIDC for SBOM sigs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Pull SBOMs from the publish jobs so the release page exposes them
      # as downloadable assets for security / procurement diligence.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: npm-sbom
          path: ./release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: docker-sbom
          path: ./release-assets

      # Cosign sign-blob both SBOMs and attach a .cosign.bundle per SBOM to
      # the GitHub Release. Closes Scorecard Signed-Releases — auditors
      # (and `cosign verify-blob`) can verify the SBOMs are the bytes we
      # shipped, not a mutated copy attacker-served from the release page.
      # Uses the same keyless OIDC flow as the Docker image signing in
      # publish-docker (no long-lived signing key).
      #
      # cosign v3+ deprecated --output-signature/--output-certificate and
      # ignores them under the default new bundle format (writing to an empty
      # --bundle path → "create bundle file: open : no such file or directory",
      # which silently broke SBOM signing from the v4.1.2 installer bump until
      # v0.4.4 surfaced it). The single .cosign.bundle carries signature +
      # cert + Rekor entry; verify with `cosign verify-blob --bundle`.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign SBOMs with cosign (keyless)
        run: |
          cd release-assets
          for sbom in *.spdx.json; do
            echo "Signing ${sbom}..."
            cosign sign-blob --yes "$sbom" \
              --bundle "${sbom}.cosign.bundle"
          done
          ls -la

      # Pre-release detection: any tag NOT matching strict vX.Y.Z (e.g.
      # vX.Y.Z-rc.N) is published as a GitHub pre-release so it doesn't
      # appear on the "latest release" sort + so users browsing the
      # repo see the production v0.4.0 not the v0.4.0-rc.1.
      - name: Determine release type
        id: release-type
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          generate_release_notes: true
          prerelease: ${{ steps.release-type.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.release-type.outputs.prerelease == 'false' && 'true' || 'false' }}
          files: |
            ./release-assets/iris-npm-sbom.spdx.json
            ./release-assets/iris-npm-sbom.spdx.json.cosign.bundle
            ./release-assets/iris-docker-sbom.spdx.json
            ./release-assets/iris-docker-sbom.spdx.json.cosign.bundle
          body: |
            ## Supply-chain transparency

            - **SBOMs**: `iris-npm-sbom.spdx.json` + `iris-docker-sbom.spdx.json` (attached below). Both are SPDX 2.3 JSON, cover direct + transitive dependencies.
            - **SBOM signatures**: each SBOM has a companion `.cosign.bundle` (Sigstore bundle — signature + cert + Rekor entry) attached to this release. Verify with:
              ```
              cosign verify-blob \
                --bundle iris-npm-sbom.spdx.json.cosign.bundle \
                --certificate-identity-regexp='https://github.com/${{ github.repository }}' \
                --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
                iris-npm-sbom.spdx.json
              ```
            - **npm provenance**: published with `--provenance` (verifiable via `npm audit signatures` or on the package page).
            - **Docker signature**: image signed with cosign keyless (Sigstore). Verify with:
              ```
              cosign verify ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
                --certificate-identity-regexp='https://github.com/${{ github.repository }}' \
                --certificate-oidc-issuer='https://token.actions.githubusercontent.com'
              ```
            - **Build attestation**: both the npm SBOM and Docker image manifest carry GitHub-signed build-provenance attestations. Inspect with `gh attestation verify` or `cosign verify-attestation`.
