name: Lighthouse

# Perf + a11y + best-practices + SEO budgets on the dashboard SPA.
# Runs on a PR or a push to main that touches the dashboard, the server that
# serves it, the seed data or this budget; it is not a required check, so a
# path filter cannot leave a PR waiting. Fails if any category score drops
# below the floor declared in lighthouserc.json.
#
# Why separate from ci.yml: Lighthouse runs Chromium headless against
# a live server, needs a 60-90s warmup, and benefits from running
# in parallel with the main test matrix. Keeping it in its own
# workflow means a flake here doesn't block a merge of unrelated
# dashboard work (but a real perf regression still alerts loudly).

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'src/dashboard/**'
      - 'scripts/seed-demo-data.ts'
      - 'lighthouserc.json'
      - 'package-lock.json'
      - '.github/workflows/lighthouse.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'src/dashboard/**'
      - 'scripts/seed-demo-data.ts'
      - 'lighthouserc.json'
      - 'package-lock.json'
      - '.github/workflows/lighthouse.yml'

# Top-level least-privilege. Lighthouse only needs to read the repo.
# Closes Scorecard Token-Permissions for this workflow.
permissions:
  contents: read

# One run per pull request: a new push cancels the run it replaces, so a
# fix-up push or a Dependabot rebase does not leave the old run holding
# runners. Every other run (a push to main, a tag, a schedule) has a group of
# its own, so none waits behind or is replaced by another: with a shared
# group, a merge queued behind a running one replaced the one queued before
# it, and that commit never got its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: cd dashboard && npm ci --no-audit --no-fund
      # One build: the dashboard, then the server.
      - run: npm run build

      # Start iris-mcp with the built dashboard on a known port in the
      # background. IRIS_NO_AUTO_LAUNCH keeps the server from opening a
      # browser window (Lighthouse drives its own Chromium).
      - name: Seed demo data
        # No `|| true`: a seed that fails would score an empty dashboard and pass.
        run: node dist/index.js --help > /dev/null 2>&1 && npm run seed:demo
      - name: Start iris-mcp + dashboard
        run: |
          IRIS_NO_AUTO_LAUNCH=1 node dist/index.js --dashboard --dashboard-port 6922 &
          echo $! > /tmp/iris.pid
          # Poll health until ready
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:6922/api/v1/health > /dev/null; then
              echo "iris-mcp ready"
              break
            fi
            sleep 1
          done

      - name: Lighthouse CI
        run: |
          # scorecard: pinned to exact version for Pinned-Dependencies check.
          # Bump in lockstep with a deliberate version bump PR, not via caret.
          npm install -g @lhci/cli@0.15.0
          lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Stop iris-mcp
        if: always()
        run: |
          if [ -f /tmp/iris.pid ]; then
            kill "$(cat /tmp/iris.pid)" || true
          fi

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30
