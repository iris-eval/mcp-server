name: claims-alignment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per pull request: a new push cancels the run it replaces, so a
# fix-up push or a Dependabot rebase does not leave the old run holding
# runners. Every other run (a push to main, a tag, a schedule) has a group of
# its own, so none waits behind or is replaced by another: with a shared
# group, a merge queued behind a running one replaced the one queued before
# it, and that commit never got its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-no-hardcoded:
    name: Hardcoded-claim scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Run hardcoded-claim scanner
        run: node scripts/claims/check-no-hardcoded.mjs

  # CONTRIBUTING.md and docs/proof.md say which checks block a merge. That is
  # a repository setting, so the list they are held to
  # (.github/required-checks.json) is compared here with the live branch
  # protection, read from the public branch endpoint.
  required-checks:
    name: Required checks match branch protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Compare the documented list with the setting
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/check-required-checks.mjs

  check-truthbase-regen:
    name: Truthbase regen vs committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Install root deps
        run: npm ci
      # The test totals are measured at a release, not here: recounting them
      # meant running the whole suite a second time on every pull request
      # (the CI test job already runs it), and failed every PR that added a
      # test until it was counted locally too. --check compares the rest.
      - name: Regenerate truthbase and compare
        run: node scripts/claims/generate.mjs --check
      # llms.txt / llms-full.txt are rendered from website/*.template.txt +
      # .claims.json. A hand edit to the rendered files, or a truthbase
      # change without a re-render, fails here — the surface written for
      # LLMs said v0.5.0 was current on v0.6.0's release day because
      # nothing read it.
      - name: llms.txt matches templates + truthbase
        run: npm run llms:check
      - name: The release narrative matches CHANGELOG.md
        run: npm run changelog:check
      # The discovery manifest is rendered from the BUILT server — tools,
      # resources, templates and the prompt read over an in-memory MCP
      # transport — so it cannot describe a server that does not exist. It
      # was hand-maintained until 0.13.0 and listed one resource of five.
      - name: .well-known/mcp.json matches the built server
        run: npm run mcp-json:check
