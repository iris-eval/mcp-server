name: Real-LLM Smoke (on demand)

# Runs scripts/track160-real-llm-judge-smoke.mjs: it checks that the
# evaluate_with_llm_judge codepath actually works against a real provider
# (OpenAI by default), not only against mocked fetch in unit tests.
#
# On demand, not nightly (2026-09-23). The LLM judge is a user-keyed feature
# (D-S94-03): the repository holds no provider key by design. A nightly
# schedule with no key can only fail, and it did, in public, every night from
# 2026-09-05 to 2026-09-23. A permanent red on the Actions tab tells a visitor
# the project is broken, which is not true, and trains the maintainer to
# ignore red, which is worse. The earlier fix (skip and report success) was
# rightly removed: a green that means "did not run" is a lie. So the schedule
# goes, and the honesty stays: run this by hand when a key is available
# (gh workflow run nightly-real-llm-smoke.yml), and a run without the key
# still fails, loudly, naming the setting that fixes it.
#
# The filename keeps its old name because proof-judge.yml and
# release-init.yml point at it.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run (e.g., post-bump verification)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  real-llm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Gate the run on the credential. Secrets can't be referenced directly in
      # step `if:` expressions, so map presence to an output here. Absent key →
      # skip the smoke (neutral) instead of FATAL-aborting the script.
      - name: Check for OPENAI_API_KEY
        id: keycheck
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::OPENAI_API_KEY repo secret is not configured, so the real-LLM smoke did not run and this run proves nothing about the provider path. Set the secret under Settings -> Secrets and variables -> Actions for the length of the run (it spends under 5 cents), then run it again."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.keycheck.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - if: steps.keycheck.outputs.present == 'true'
        run: npm ci
      - if: steps.keycheck.outputs.present == 'true'
        # The server alone: this smoke never serves the UI, and the one
        # `npm run build` (dashboard, then server since A6-9) would need the
        # dashboard's dependencies installed for nothing.
        run: npm run build:server
      # Run the real-LLM smoke. Script reads OPENAI_API_KEY from env.
      # Cost cap enforced inside the script + the llm-judge evaluator's
      # pessimistic pre-check (< $0.05 total).
      - name: Run track160 real-LLM smoke
        if: steps.keycheck.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/track160-real-llm-judge-smoke.mjs
      - name: Upload smoke run artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: real-llm-smoke-output
          path: |
            *.log
            *.json
          if-no-files-found: ignore
          retention-days: 30
