name: Nightly Real-LLM Smoke

# Wires the existing scripts/track160-real-llm-judge-smoke.mjs into a
# scheduled CI job. The script verifies that the v0.4 evaluate_with_llm_judge
# codepath actually works against a real provider (OpenAI by default) — not
# just against mocked fetch in unit tests.
#
# Why nightly + not on every PR:
#   - Each run spends real money (< $0.05 budget enforced via pre-check)
#   - The wire-shape gate is a "background regression catcher", not a
#     PR-blocker — if the OpenAI API breaks our parser, we want to know
#     within 24h, not necessarily within 24 minutes
#   - Pinning expensive jobs to cron + manual dispatch keeps PR cycle fast
#
# Failure handling: when OPENAI_API_KEY is configured, the workflow fails if
# the smoke script exits non-zero — a red schedule + notification, which the
# maintainer triages (usually a provider wire-shape change needing a code
# update).
#
# When the secret is ABSENT the job used to skip AND REPORT SUCCESS, on the
# reasoning that a perpetual red trains reviewers to ignore the check. That
# reasoning was wrong in exactly the way this project spent 2026-09-04
# removing from the product itself: a green that means "did not run" is
# indistinguishable from a green that means "passed", and this one reported
# success every night for months while calling no provider at all. A scheduled
# run with no credential now FAILS, loudly, naming the one setting that fixes
# it. No pull request is blocked by a nightly, so the only thing the red costs
# is the accurate knowledge that this coverage is switched off.

on:
  schedule:
    # 07:00 UTC daily (~midnight US Pacific). Avoids workday CI churn,
    # surfaces overnight breaks for morning triage.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run (e.g., post-bump verification)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  real-llm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Gate the run on the credential. Secrets can't be referenced directly in
      # step `if:` expressions, so map presence to an output here. Absent key →
      # skip the smoke (neutral) instead of FATAL-aborting the script.
      - name: Check for OPENAI_API_KEY
        id: keycheck
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::OPENAI_API_KEY repo secret is not configured, so the real-LLM smoke did not run and this nightly proves nothing about the provider path. Set the secret under Settings -> Secrets and variables -> Actions (the smoke spends under 5 cents a night), or delete this workflow and stop claiming the coverage."
            exit 1
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        if: steps.keycheck.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - if: steps.keycheck.outputs.present == 'true'
        run: npm ci
      - if: steps.keycheck.outputs.present == 'true'
        run: npm run build
      # Run the real-LLM smoke. Script reads OPENAI_API_KEY from env.
      # Cost cap enforced inside the script + the llm-judge evaluator's
      # pessimistic pre-check (< $0.05 total).
      - name: Run track160 real-LLM smoke
        if: steps.keycheck.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/track160-real-llm-judge-smoke.mjs
      - name: Upload smoke run artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: real-llm-smoke-output
          path: |
            *.log
            *.json
          if-no-files-found: ignore
          retention-days: 30
