# Publish the Python client to PyPI by trusted publishing:
# no token in this repository — PyPI trusts this workflow, in this
# repository, in the `pypi` environment, through the OIDC token GitHub
# mints for the run. The project `iris-eval` and the publisher are
# registered on PyPI by hand, once, by a maintainer; until then the
# publish step is refused by PyPI and the build step still proves the
# package builds.
#
# Tag `py-vX.Y.Z` where X.Y.Z is packages/python/pyproject.toml's version,
# at a commit that is on main.
#
# Every pull request runs the build job too: the hash-pinned install, the
# build and the fresh-environment import are what a tag will run, so they are
# proven before one is pushed rather than on release day. The publish job
# runs only for a py-v* tag, so a pull request builds and publishes nothing.
name: Publish the Python client

on:
  push:
    tags: ['py-v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build the sdist and the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      # Only reviewed code ships, as in release.yml: a py-v* tag pushed at a
      # commit that never reached main (an unmerged branch, a local
      # experiment) would otherwise publish to PyPI with a valid trusted-
      # publishing identity for code no pull request ever showed.
      - name: Verify the tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/py-v')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "FATAL: $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit that is on main."
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: The tag names the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/py-v')
        run: |
          tag="${GITHUB_REF_NAME#py-v}"
          version="$(python -c "import tomllib; print(tomllib.load(open('packages/python/pyproject.toml','rb'))['project']['version'])")"
          [ "$tag" = "$version" ] || { echo "::error::tag py-v$tag but pyproject.toml says $version"; exit 1; }
      # The build frontend AND the backend pyproject.toml names (hatchling),
      # with every dependency, from wheels whose sha256 is committed in
      # .github/requirements/build.txt. --no-isolation builds with exactly
      # those: an isolated build would download the backend again, unpinned.
      - name: Install the build tools, hash-pinned
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/requirements/build.txt
      - run: python -m build --no-isolation packages/python --outdir dist
      - name: The wheel installs into a fresh environment and imports
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/python -c "import iris_eval; print('iris-eval', iris_eval.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/iris-eval/
    permissions:
      id-token: write        # trusted publishing: PyPI verifies the OIDC token, no API token stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
