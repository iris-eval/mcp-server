version: 2
# One pull request per directory per week for minor and patch updates (the
# catch-all group last in each block), majors on their own, and a five-day
# cooldown before a new release is proposed. Measured 10-01 to 10-05: 266 of
# 1,000 Actions runs were on Dependabot branches (31 branches, 21 re-pushes),
# each running about 73 checks, and the batches were then hand-merged. The
# cooldown also keeps a release that is pulled within days of publishing (the
# usual shape of a compromised package) from reaching a PR at all.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    ignore:
      # typescript-eslint admits typescript >=4.8.4 <6.1.0 (re-checked 2026-10-04), so 6.0 can land (#58).
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # No 13.x release publishes Windows prebuilt binaries (none through 13.0.3, re-checked
      # 2026-10-04), so a Windows install would have to compile it from source. Lift this when one does.
      - dependency-name: "better-sqlite3"
        versions: [">=13.0.0"]
    groups:
      linting:
        patterns:
          - "@typescript-eslint/*"
          - "eslint*"
          - "prettier"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
      types:
        patterns:
          - "@types/*"
      # Everything else that is not a major: one PR.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(website)"
    ignore:
      - dependency-name: "eslint"
        versions: [">=10.0.0"]  # Blocked by eslint-config-next plugin peer deps (see #54)
      # Same constraint as the root's #58 ceiling, one directory over — the
      # root block's ignore does NOT apply here. eslint-config-next bundles
      # its own typescript-eslint, which throws
      # "TypeError: Cannot read properties of undefined (reading 'Cjs')"
      # against TS 7. Without this, Dependabot re-proposes an unmergeable
      # major every week (PR #300).
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      types:
        patterns:
          - "@types/*"
      # Everything else that is not a major: one PR.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(dashboard)"
    ignore:
      # The dashboard is on TypeScript 6.0. Its lint, typescript-eslint, admits typescript
      # <6.1.0 (re-checked 2026-10-04), so npm ci refuses 7 until typescript-eslint does.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      types:
        patterns:
          - "@types/*"

  # The JavaScript SDK's own toolchain and the provider SDKs its tests drive
  # (packages/sdk has its own lockfile; the package has no runtime dependencies).
      # Everything else that is not a major: one PR.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/packages/sdk"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(sdk)"
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]  # the same ceiling as the root (see #58)
      # The package supports Node >=22 (engines), so its Node types stay on 22:
      # newer types would let the SDK call an API its oldest supported runtime lacks.
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
    groups:
      providers:
        patterns:
          - "openai"
          - "@anthropic-ai/sdk"
          - "ai"

  # The LangChain.js integration's toolchain and the framework its tests drive
  # (packages/langchain has its own lockfile; @iris-eval/sdk is linked from ../sdk).
      # Everything else that is not a major: one PR.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/packages/langchain"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(langchain)"
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]  # the same ceiling as the root (see #58)
    groups:
      langchain:
        patterns:
          - "@langchain/*"

  # The MCP clients the real-clients CI job drives (Claude Code, Gemini CLI),
  # installed with `npm ci` from this lockfile. A bump is a re-verification:
  # the job proves the new client still connects to the packed server.
      # Everything else that is not a major: one PR.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/.github/real-clients"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(real-clients)"

  # The hash-pinned tools publish-python.yml builds the Python client with
  # (build.in -> build.txt, pip-compile --generate-hashes).
    groups:
      # Everything else that is not a major: one PR.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(python-build)"
    groups:
      # Everything else that is not a major: one PR.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    # Cap raised from the default 5: the github-actions queue sat saturated
    # at exactly 5 open PRs, so codeql-action/analyze and upload-sarif had no
    # PR at all — not because they were current, but because there was no
    # room. A silently-full queue looks identical to "nothing to update".
    open-pull-requests-limit: 10
    groups:
      docker:
        patterns:
          - "docker/*"
      github:
        patterns:
          - "actions/*"
      # github/codeql-action/* matched NEITHER pattern above, so Dependabot
      # opened one PR per step. CodeQL requires every step in a run to be on
      # the SAME version — a lone init or autobuild bump makes Autobuild fail
      # with "Not all workflow steps that use github/codeql-action actions use
      # the same version", and no PR can fix that from inside itself (it is
      # the four steps across codeql.yml + scorecard.yml that must move
      # together). This already cost one hand-written batch PR; grouping is
      # what stops a third round.
      codeql:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
    ignore:
      # Node major bumps need manual review — Dependabot doesn't distinguish
      # LTS (even majors) from Current (odd majors). Iris production runtime
      # stays on the latest Active LTS. Patch + minor bumps within an LTS
      # major still flow through Dependabot.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      # Everything else that is not a major: one PR.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Directories CI installs from that nothing watched until now. They are
  # examples and the Python client's own toolchain: monthly, one PR each.
  - package-ecosystem: "npm"
    directory: "/examples/otel-recipes/js"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(examples)"
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/examples/otel-recipes"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(examples)"
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/packages/python"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(python)"
    groups:
      all:
        patterns:
          - "*"
