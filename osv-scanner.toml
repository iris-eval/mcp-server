# Advisories against package-lock.json that OSV-Scanner, and OpenSSF
# Scorecard's Vulnerabilities check, should report as assessed rather than open.
# Each entry carries its reason; the full assessment is the advisory's row in
# SECURITY-EXPOSURE.md, and the entry leaves when that row is closed.
# ignoreUntil makes each one lapse unless it is reviewed again.

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2027-02-17
reason = "The fault needs a glob pattern of one shape, and nothing outside this repository supplies a pattern. picomatch 4.0.7 is loaded only by the test runner (vitest, vite and tinyglobby), never by the published package, and compiles the patterns of this repository's Vitest configurations and the tools' own defaults. No fixed release exists: 4.0.7 is the newest. It moves by a lockfile bump when one is published."
