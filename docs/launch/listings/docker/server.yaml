# Docker MCP Catalog entry for Iris — paste-ready for a pull
# request to docker/mcp-registry as servers/iris-eval/server.yaml. The image
# is the one this repository publishes (ghcr.io/iris-eval/mcp-server); the
# secrets are the variables server.json lists. Fill source.commit from the
# release tag at submission: git rev-list -n 1 v<version>.
name: iris-eval
image: ghcr.io/iris-eval/mcp-server
type: server
meta:
  category: devops
  tags:
    - evaluation
    - agents
    - observability
    - devops
about:
  title: Iris
  description: Stop shipping agents on vibes. Score every agent output for quality, safety, and cost.
  icon: https://iris-eval.com/iris-logo-white-bg.png
source:
  project: https://github.com/iris-eval/mcp-server
  commit: FILL_AT_SUBMISSION_FROM_THE_RELEASE_TAG
config:
  description: >-
    Runs over stdio with no key by default; the SQLite database lives inside the container unless a volume is mounted.
    The web dashboard is not reachable from a stdio container, so it stays off here. The LLM judge is off unless a
    provider key is set; nothing leaves the container unless IRIS_OTEL_ENDPOINT names a collector.
  secrets:
    - name: iris.api_key
      env: IRIS_API_KEY
      example: <YOUR_KEY>
      description: Optional — only a server bound beyond loopback (HTTP transport or dashboard) requires it; stdio does not.
    - name: iris.anthropic_api_key
      env: IRIS_ANTHROPIC_API_KEY
      example: <YOUR_KEY>
      description: Optional — enables the LLM judge tool with your own Anthropic key.
    - name: iris.openai_api_key
      env: IRIS_OPENAI_API_KEY
      example: <YOUR_KEY>
      description: Optional — enables the LLM judge tool with your own OpenAI key.
  env:
    - name: IRIS_LOG_LEVEL
      example: info
      value: info
